<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Dark background -->
  <rect width="200" height="220" rx="16" fill="#131829"/>

  <!-- Gold square border -->
  <rect x="30" y="20" width="140" height="140" rx="4" stroke="#d4941c" stroke-width="6" fill="none"/>

  <!-- Bell icon -->
  <g transform="translate(100, 90)">
    <!-- Bell body -->
    <path d="M0-45 C-25-45 -40-25 -40 0 L-40 15 -50 25 50 25 40 15 40 0 C40-25 25-45 0-45Z" fill="#e8a820"/>
    <!-- Bell clapper -->
    <circle cx="0" cy="32" r="8" fill="#e8a820"/>
    <!-- Bell top nub -->
    <circle cx="0" cy="-45" r="6" fill="#e8a820"/>
  </g>

  <!-- GOLDBELL text -->
  <text x="100" y="195" text-anchor="middle" fill="#e8a820" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" letter-spacing="6">GOLDBELL</text>
</svg>
